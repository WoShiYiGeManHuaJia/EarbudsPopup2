name: Build EarbudsPopup2 APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate fixed debug keystore for consistent signing
        run: |
          keytool -genkeypair -v \
            -dname "CN=EarbudsPopup2, OU=Dev, O=WoshiYiGeManHuaJia, L=China, ST=Guangdong, C=CN" \
            -keystore release.keystore \
            -storepass android \
            -keypass android \
            -alias release \
            -keyalg RSA -keysize 2048 -validity 10000
          echo "Generated: $(ls -la release.keystore)"
          echo "SHA1: $(keytool -list -v -keystore release.keystore -storepass android -alias release 2>/dev/null | grep SHA1)"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Show Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls "$ANDROID_SDK_ROOT/platforms" || true
          ls "$ANDROID_SDK_ROOT/build-tools" || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Build Release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: earbuds-popup2-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
