name: Build EarbudsPopup2 APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify signing keystore
        run: |
          ls -la release.keystore
          keytool -list -v -keystore release.keystore -storepass android -alias release | grep -E "Alias name|SHA1:|Valid"

      - name: Show Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls "$ANDROID_SDK_ROOT/platforms" || true
          ls "$ANDROID_SDK_ROOT/build-tools" || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Build Release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Show APK signatures
        if: always()
        run: |
          for f in app/build/outputs/apk/debug/*.apk app/build/outputs/apk/release/*.apk; do
            echo "=== $f ==="
            "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" verify --print-certs "$f" 2>/dev/null | head -5 || true
          done

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: earbuds-popup2-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
